name: 构建 Ubuntu Server 镜像

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本号'
        required: true
        default: '6.18'
        type: string
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'ubuntu-server_build.sh'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'ubuntu-server_build.sh'

env:
  UBUNTU_VERSION: resolute
  IMAGE_SIZE: 3G
  HOSTNAME: xiaomi-raphael

jobs:
  setup:
    name: 检查依赖
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查内核包目录
        id: check-deps
        run: |
          echo "检查内核包..."
          DEBS_DIR="xiaomi-raphael-debs_${KERNEL_VERSION}"
          echo "debs_dir=$DEBS_DIR" >> $GITHUB_OUTPUT

          if [ ! -d "$DEBS_DIR" ]; then
            echo "警告: $DEBS_DIR 目录不存在，将从 Release 下载"
          else
            echo "找到本地内核包目录: $DEBS_DIR"
            ls -la "$DEBS_DIR/"
          fi

          echo "kernel_version=${KERNEL_VERSION}" >> $GITHUB_OUTPUT

    outputs:
      debs_dir: ${{ steps.check-deps.outputs.debs_dir }}
      kernel_version: ${{ steps.check-deps.outputs.kernel_version }}

  build:
    name: 构建镜像
    needs: setup
    runs-on: ubuntu-24.04-arm
    env:
      KERNEL_VERSION: ${{ needs.setup.outputs.kernel_version }}
      DEBS_DIR: ${{ needs.setup.outputs.debs_dir }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 apt
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-arm64-${{ hashFiles('**/sources.list.tpl') }}
          restore-keys: |
            apt-${{ runner.os }}-arm64-

      - name: 安装构建工具
        run: |
          sudo apt update
          sudo apt install -y debootstrap p7zip-full coreutils

      - name: 下载内核包
        if: needs.setup.outputs.debs_dir == 'xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}'
        run: |
          mkdir -p xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}

          echo "正在下载内核包 (版本: ${{ env.KERNEL_VERSION }})..."

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb \
            "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb"

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb \
            "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb"

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb \
            "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb"

          curl -sL -o xiaomi-k20pro-boot.img \
            "https://github.com/GengWei1997/kernel-deb/releases/download/v1.0.0/xiaomi-k20pro-boot.img"

          echo "下载完成"
          ls -la xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/

      - name: 检查必要文件
        run: |
          echo "检查构建所需文件..."

          if [ ! -f "xiaomi-k20pro-boot.img" ]; then
            echo "错误: xiaomi-k20pro-boot.img 不存在"
            exit 1
          fi

          if [ ! -f "xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" ]; then
            echo "错误: linux-image-xiaomi-raphael.deb 不存在"
            exit 1
          fi

          echo "所有必要文件存在"

      - name: 执行模块化构建
        run: |
          set -e

          export UBUNTU_VERSION=resolute
          export IMAGE_SIZE=3G
          export HOSTNAME=xiaomi-raphael
          export KERNEL_DEBS_DIR="xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}"
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH

          chmod +x scripts/*.sh

          sudo sh scripts/01-create-image.sh
          sudo sh scripts/02-bootstrap.sh
          sudo sh scripts/03-mount-dev.sh
          sudo sh scripts/04-config-network.sh
          sudo sh scripts/05-apt-setup.sh
          sudo sh scripts/06-install-packages.sh
          sudo sh scripts/07-config-locale.sh
          sudo sh scripts/08-install-device-pkgs.sh
          sudo sh scripts/09-install-kernel.sh
          sudo sh scripts/10-config-ncm.sh
          sudo sh scripts/11-config-fstab.sh
          sudo sh scripts/12-create-users.sh
          sudo sh scripts/13-config-power.sh
          sudo sh scripts/14-cleanup.sh
          sudo sh scripts/15-finalize.sh

          echo "镜像构建完成"

      - name: 生成 SHA256 校验和
        run: |
          echo "生成校验和..."
          sha256sum rootfs.img rootfs.7z > sha256sums.txt
          cat sha256sums.txt

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-server-rootfs-${{ env.KERNEL_VERSION }}
          path: |
            rootfs.7z
            rootfs.img
            sha256sums.txt
            xiaomi-k20pro-boot.img
          retention-days: 30

      - name: 清理临时文件
        if: always()
        run: |
          sudo rm -f rootfs.img rootfs.7z xiaomi-k20pro-boot.img 2>/dev/null || true
          sudo rm -rf rootdir 2>/dev/null || true
          rm -rf xiaomi-raphael-debs_* 2>/dev/null || true

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: 下载镜像
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-server-rootfs-${{ env.KERNEL_VERSION }}
          path: .

      - name: 获取构建信息
        id: build-info
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-server-v${{ env.KERNEL_VERSION }}
          name: Ubuntu Server 镜像 v${{ env.KERNEL_VERSION }}
          body: |
            小米 Raphael 设备 Ubuntu Server ARM64 镜像

            - 内核版本: ${{ env.KERNEL_VERSION }}
            - 构建时间: ${{ steps.build-info.outputs.timestamp }}
            - 构建ID: ${{ github.run_id }}-${{ github.run_number }}

            ## 文件说明

            - `rootfs.7z` - 压缩的根文件系统镜像
            - `rootfs.img` - 原始根文件系统镜像
            - `xiaomi-k20pro-boot.img` - Boot 分区镜像
            - `sha256sums.txt` - SHA256 校验和

            ## 使用方法

            ```bash
            7z x rootfs.7z
            dd if=rootfs.img of=/dev/sdX bs=1M status=progress
            ```
          draft: false
          prerelease: false
          files: |
            rootfs.7z
            rootfs.img
            sha256sums.txt
            xiaomi-k20pro-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
