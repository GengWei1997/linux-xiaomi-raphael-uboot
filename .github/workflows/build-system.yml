name: 构建系统镜像

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: true
        type: choice
        options:
          - parallel
          - single
        default: 'parallel'
      system_types:
        description: '系统类型 (用逗号分隔多个值，如: debian-server,debian-gnome)'
        required: false
        default: 'debian-server,debian-gnome,debian-phosh,ubuntu-server,ubuntu-gnome,ubuntu-phosh'
        type: string
      kernel_versions:
        description: '内核版本 (用逗号分隔多个值，如: 6.18,7.0)'
        required: false
        default: '6.18,7.0'
        type: string
      bootstrap_tools:
        description: '构建工具 (用逗号分隔多个值，如: mmdebstrap)'
        required: false
        default: 'mmdebstrap'
        type: string
      desktop_environments:
        description: '桌面环境 (仅适用于Phosh版本)'
        required: false
        default: 'phosh-full'
        type: string
      debian_versions:
        description: 'Debian 版本 (用逗号分隔多个值，如: trixie,bookworm)'
        required: false
        default: 'trixie'
        type: string
      ubuntu_versions:
        description: 'Ubuntu 版本 (用逗号分隔多个值，如: noble,resolute)'
        required: false
        default: 'resolute'
        type: string
      kernel_repository:
        description: '内核包仓库'
        required: false
        default: 'GengWei1997/linux-xiaomi-raphael-uboot'
        type: string
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'

env:
  HOSTNAME: xiaomi-raphael
  BOOT_IMG: xiaomi-k20pro-boot.img
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPPRESS_DEPRECATION_WARNINGS: true

permissions:
  contents: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: 生成构建矩阵
        id: generate
        run: |
          set -e
          
          BUILD_MODE="${{ github.event.inputs.build_mode }}"
          SYS_TYPES="${{ github.event.inputs.system_types }}"
          KERN_VERS="${{ github.event.inputs.kernel_versions }}"
          BOOT_TOOLS="${{ github.event.inputs.bootstrap_tools }}"
          DESKTOP_ENV="${{ github.event.inputs.desktop_environments }}"
          DEB_VERS="${{ github.event.inputs.debian_versions }}"
          UBU_VERS="${{ github.event.inputs.ubuntu_versions }}"
          
          if [ "$BUILD_MODE" = "single" ]; then
            # 单模式：取每个输入的第一个值
            SYS_TYPE=$(echo "$SYS_TYPES" | cut -d',' -f1)
            KERN_VER=$(echo "$KERN_VERS" | cut -d',' -f1)
            TOOL=$(echo "$BOOT_TOOLS" | cut -d',' -f1)
            
            if [[ "$SYS_TYPE" == debian-* ]]; then
              DEB_VER=$(echo "$DEB_VERS" | cut -d',' -f1)
              UBU_VER=""
            else
              DEB_VER=""
              UBU_VER=$(echo "$UBU_VERS" | cut -d',' -f1)
            fi
            
            MATRIX="[{"system_type":"$SYS_TYPE","kernel_version":"$KERN_VER","bootstrap_tool":"$TOOL","debian_version":"$DEB_VER","ubuntu_version":"$UBU_VER","desktop_env":"$DESKTOP_ENV"}]"
          else
            # 并行模式：使用纯 bash 生成 JSON
            MATRIX="["
            FIRST_ITEM=true
            
            # 分割字符串为数组
            IFS=',' read -ra SYS_ARRAY <<< "$SYS_TYPES"
            IFS=',' read -ra KERN_ARRAY <<< "$KERN_VERS"
            IFS=',' read -ra TOOL_ARRAY <<< "$BOOT_TOOLS"
            IFS=',' read -ra DEB_ARRAY <<< "$DEB_VERS"
            IFS=',' read -ra UBU_ARRAY <<< "$UBU_VERS"
            
            # 生成 Debian 组合
            for sys in "${SYS_ARRAY[@]}"; do
              if [[ "$sys" == debian-* ]]; then
                for kern in "${KERN_ARRAY[@]}"; do
                  for tool in "${TOOL_ARRAY[@]}"; do
                    for deb_ver in "${DEB_ARRAY[@]}"; do
                      if [ "$FIRST_ITEM" = true ]; then
                        FIRST_ITEM=false
                      else
                        MATRIX="${MATRIX},"
                      fi
                      MATRIX="${MATRIX}{\"system_type\":\"$sys\",\"kernel_version\":\"$kern\",\"bootstrap_tool\":\"$tool\",\"debian_version\":\"$deb_ver\",\"ubuntu_version\":\"\",\"desktop_env\":\"$DESKTOP_ENV\"}"
                    done
                  done
                done
              fi
            done
            
            # 生成 Ubuntu 组合
            for sys in "${SYS_ARRAY[@]}"; do
              if [[ "$sys" == ubuntu-* ]]; then
                for kern in "${KERN_ARRAY[@]}"; do
                  for tool in "${TOOL_ARRAY[@]}"; do
                    for ubu_ver in "${UBU_ARRAY[@]}"; do
                      if [ "$FIRST_ITEM" = true ]; then
                        FIRST_ITEM=false
                      else
                        MATRIX="${MATRIX},"
                      fi
                      MATRIX="${MATRIX}{\"system_type\":\"$sys\",\"kernel_version\":\"$kern\",\"bootstrap_tool\":\"$tool\",\"debian_version\":\"\",\"ubuntu_version\":\"$ubu_ver\",\"desktop_env\":\"$DESKTOP_ENV\"}"
                    done
                  done
                done
              fi
            done
            
            MATRIX="${MATRIX}]"
          fi
          
          echo "Generated matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: generate-matrix
    name: ${{ format('构建 {0} 镜像', matrix.system_type) }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      SYSTEM_TYPE: ${{ matrix.system_type }}
      KERNEL_VERSION: ${{ matrix.kernel_version }}
      BOOTSTRAP_TOOL: ${{ matrix.bootstrap_tool }}
      DESKTOP_ENV: ${{ matrix.desktop_env }}
      DEBIAN_VERSION: ${{ matrix.debian_version }}
      UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
      KERNEL_REPO: ${{ github.event.inputs.kernel_repository || 'GengWei1997/linux-xiaomi-raphael-uboot' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装构建工具
        run: |
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 检查并安装构建工具: ${{ env.BOOTSTRAP_TOOL }}"
          
          if [ "${{ env.BOOTSTRAP_TOOL }}" = "mmdebstrap" ]; then
            if ! command -v mmdebstrap &> /dev/null; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   安装 mmdebstrap 和依赖..."
              sudo apt-get update
              sudo apt-get install -y mmdebstrap debian-archive-keyring
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   mmdebstrap 安装完成"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   mmdebstrap 已安装，跳过"
            fi
          else
            if ! command -v debootstrap &> /dev/null; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   安装 debootstrap..."
              sudo apt-get update
              sudo apt-get install -y debootstrap
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   debootstrap 安装完成"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   debootstrap 已安装，跳过"
            fi
          fi

      - name: 下载内核包和boot.img (并行)
        run: |
          mkdir -p xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}

          echo "正在下载内核包和boot.img (版本: ${{ env.KERNEL_VERSION }})..."

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" &
          PID1=$!

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb" &
          PID2=$!

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb" &
          PID3=$!

          curl -sL -o xiaomi-k20pro-boot.img \
            "https://github.com/GengWei1997/kernel-deb/releases/download/v1.0.0/xiaomi-k20pro-boot.img" &
          PID4=$!

          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* || "${{ env.SYSTEM_TYPE }}" == *"gnome"* ]]; then
            curl -sL -o alsa-xiaomi-raphael.deb \
              "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/alsa-xiaomi-raphael.deb" &
            PID5=$!
          fi

          wait $PID1 $PID2 $PID3 $PID4
          [ -n "$PID5" ] && wait $PID5 || true

          echo "所有文件下载完成"

      - name: 检查必要文件
        run: |
          echo "检查构建所需文件..."

          if [ ! -f "xiaomi-k20pro-boot.img" ]; then
            echo "错误: xiaomi-k20pro-boot.img 不存在"
            exit 1
          fi

          if [ ! -f "xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" ]; then
            echo "错误: linux-image-xiaomi-raphael.deb 不存在"
            exit 1
          fi

          echo "所有必要文件存在"

      - name: 执行构建
        run: |
          set -e

          chmod +x build.sh

          sudo BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "${{ env.DESKTOP_ENV }}" "${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION }}"

      - name: 生成SHA256校验和
        run: |
          SUFFIX="${{ env.SYSTEM_TYPE }}-${{ env.KERNEL_VERSION }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION }}"
          echo "生成校验和... ($SUFFIX)"
          sha256sum rootfs.img xiaomi-k20pro-boot.img > sha256sums-${SUFFIX}.txt
          cat sha256sums-${SUFFIX}.txt

      - name: 压缩镜像
        run: |
          7z a rootfs.7z rootfs.img xiaomi-k20pro-boot.img

      - name: 准备 Release 变量
        if: github.event_name == 'workflow_dispatch'
        id: create-release
        run: |
          # 1. 提取校验和
          SHA256_ROOTFS=$(awk 'NR==1 {print $1}' sha256sums.txt)
          SHA256_BOOT=$(awk 'NR==2 {print $1}' sha256sums.txt)
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')

          # 2. 确定系统元数据
          [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]] && OS_NAME="Debian" || OS_NAME="Ubuntu"
          [[ "${{ env.SYSTEM_TYPE }}" == *"server"* ]] && CATEGORY="Server" || CATEGORY="Desktop"
          [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]] && OS_VERSION="${{ env.DEBIAN_VERSION }}" || OS_VERSION="${{ env.UBUNTU_VERSION }}"
          
          # 3. 构造 Release 标题和标签
          # 标签: 系统类型-内核-系统版本[-桌面环境]
          TAG="${{ env.SYSTEM_TYPE }}-v${{ env.KERNEL_VERSION }}-${OS_VERSION}"
          [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]] && TAG="${TAG}-${{ env.DESKTOP_ENV }}"
          
          # 标题: 更加直观的展示
          RELEASE_TITLE="${OS_NAME} ${CATEGORY} 镜像 v${{ env.KERNEL_VERSION }} (${OS_VERSION})"
          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]]; then
            RELEASE_TITLE="${RELEASE_TITLE} - ${{ env.DESKTOP_ENV }}"
          elif [[ "${{ env.SYSTEM_TYPE }}" == *"gnome"* ]]; then
            RELEASE_TITLE="${RELEASE_TITLE} - GNOME"
          fi

          # 4. 直接利用 Heredoc 生成描述内容 (无需 sed)
          {
            echo "description<<EOF"
            echo "## 小米 Raphael (K20 Pro) ${OS_NAME} 镜像"
            echo ""
            echo "> 适用于小米 Raphael (K20 Pro/Mi 9T Pro) 的 ${OS_NAME} ${CATEGORY} 自动构建版本"
            echo ""
            echo "### 📊 镜像信息"
            echo "| 属性 | 值 |"
            echo "|------|----|"
            echo "| 系统版本 | ${OS_NAME} ${OS_VERSION} |"
            echo "| 内核版本 | Linux ${{ env.KERNEL_VERSION }} |"
            echo "| 构建工具 | ${{ env.BOOTSTRAP_TOOL }} |"
            echo "| 构建时间 | ${TIMESTAMP} |"
            echo "| 构建 ID | ${GITHUB_RUN_ID} |"
            echo ""
            echo "### 🔒 SHA256 校验"
            echo "\`\`\`"
            echo "rootfs.img: ${SHA256_ROOTFS}"
            echo "boot.img:   ${SHA256_BOOT}"
            echo "\`\`\`"
            echo ""
            echo "### 🔑 默认凭据"
            echo "- **用户**: \`user\` / **密码**: \`1234\`"
            echo "- **用户**: \`root\` / **密码**: \`1234\`"
            echo ""
            echo "### 🌐 网络连接 (USB NCM)"
            echo "- 设备 IP: \`172.16.42.1\`"
            echo "- SSH 命令: \`ssh user@172.16.42.1\`"
            echo ""
            echo "---"
            echo "*Built with ❤️ by GitHub Actions*"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create-release.outputs.tag }}
          name: ${{ steps.create-release.outputs.name }}
          body: ${{ steps.create-release.outputs.description }}
          draft: false
          prerelease: false
          files: |
            rootfs.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理临时文件
        if: always()
        run: |
          SUFFIX="${{ env.SYSTEM_TYPE }}-${{ env.KERNEL_VERSION }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION }}"
          sudo rm -f alsa-xiaomi-raphael.deb 2>/dev/null || true
          sudo rm -rf rootdir 2>/dev/null || true
          rm -rf xiaomi-raphael-debs_* 2>/dev/null || true
          rm -f sha256sums-${SUFFIX}.txt 2>/dev/null || true
