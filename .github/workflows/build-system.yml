name: 构建系统镜像

on:
  workflow_dispatch:
    inputs:
      system_type:
        description: '系统类型'
        required: true
        type: choice
        options:
          - debian-server
          - debian-gnome
          - debian-phosh
          - ubuntu-server
          - ubuntu-gnome
          - ubuntu-phosh
      kernel_version:
        description: '内核版本号'
        required: true
        type: choice
        options:
          - '6.18'
          - '7.0'
        default: '7.0'
      bootstrap_tool:
        description: '构建工具 (mmdebstrap更快，推荐使用)'
        required: true
        type: choice
        options:
          - mmdebstrap
          - debootstrap
        default: 'mmdebstrap'
      desktop_environment:
        description: '桌面环境 (仅适用于Phosh版本)'
        required: false
        default: 'phosh-full'
        type: choice
        options:
          - phosh-core
          - phosh-full
          - phosh-phone
      debian_version:
        description: 'Debian 版本 (仅适用于Debian类型)'
        required: false
        type: choice
        options:
          - trixie
          - bookworm
        default: 'trixie'
      ubuntu_version:
        description: 'Ubuntu 版本 (仅适用于Ubuntu类型)'
        required: false
        type: choice
        options:
          - noble
          - resolute
        default: 'resolute'
      kernel_repository:
        description: '内核包仓库 (默认: GengWei1997/linux-xiaomi-raphael-uboot)'
        required: false
        default: 'GengWei1997/linux-xiaomi-raphael-uboot'
        type: string
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'

env:
  HOSTNAME: xiaomi-raphael
  BOOT_IMG: xiaomi-k20pro-boot.img
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPPRESS_DEPRECATION_WARNINGS: true

permissions:
  contents: write

jobs:
  build:
    name: 构建镜像
    runs-on: ubuntu-24.04-arm
    env:
      SYSTEM_TYPE: ${{ github.event.inputs.system_type || 'ubuntu-server' }}
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.18' }}
      BOOTSTRAP_TOOL: ${{ github.event.inputs.bootstrap_tool || 'mmdebstrap' }}
      DESKTOP_ENV: ${{ github.event.inputs.desktop_environment || 'phosh-full' }}
      DEBIAN_VERSION: ${{ github.event.inputs.debian_version || 'trixie' }}
      UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || 'resolute' }}
      KERNEL_REPO: ${{ github.event.inputs.kernel_repository || 'GengWei1997/linux-xiaomi-raphael-uboot' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装构建工具
        run: |
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 检查并安装构建工具: ${{ env.BOOTSTRAP_TOOL }}"
          
          if [ "${{ env.BOOTSTRAP_TOOL }}" = "mmdebstrap" ]; then
            if ! command -v mmdebstrap &> /dev/null; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   安装 mmdebstrap 和依赖..."
              sudo apt-get update
              sudo apt-get install -y mmdebstrap debian-archive-keyring
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   mmdebstrap 安装完成"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   mmdebstrap 已安装，跳过"
            fi
          else
            if ! command -v debootstrap &> /dev/null; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   安装 debootstrap..."
              sudo apt-get update
              sudo apt-get install -y debootstrap
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   debootstrap 安装完成"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   debootstrap 已安装，跳过"
            fi
          fi

      - name: 下载内核包和boot.img (并行)
        run: |
          mkdir -p xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}

          echo "正在下载内核包和boot.img (版本: ${{ env.KERNEL_VERSION }})..."

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" &
          PID1=$!

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb" &
          PID2=$!

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb" &
          PID3=$!

          curl -sL -o xiaomi-k20pro-boot.img \
            "https://github.com/GengWei1997/kernel-deb/releases/download/v1.0.0/xiaomi-k20pro-boot.img" &
          PID4=$!

          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* || "${{ env.SYSTEM_TYPE }}" == *"gnome"* ]]; then
            curl -sL -o alsa-xiaomi-raphael.deb \
              "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/alsa-xiaomi-raphael.deb" &
            PID5=$!
          fi

          wait $PID1 $PID2 $PID3 $PID4
          [ -n "$PID5" ] && wait $PID5 || true

          echo "所有文件下载完成"

      - name: 检查必要文件
        run: |
          echo "检查构建所需文件..."

          if [ ! -f "xiaomi-k20pro-boot.img" ]; then
            echo "错误: xiaomi-k20pro-boot.img 不存在"
            exit 1
          fi

          if [ ! -f "xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" ]; then
            echo "错误: linux-image-xiaomi-raphael.deb 不存在"
            exit 1
          fi

          echo "所有必要文件存在"

      - name: 执行构建
        run: |
          set -e

          chmod +x build.sh

          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]]; then
            if [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]]; then
              sudo BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "${{ env.DESKTOP_ENV }}" "${{ env.DEBIAN_VERSION }}"
            else
              sudo BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "${{ env.DESKTOP_ENV }}" "${{ env.UBUNTU_VERSION }}"
            fi
          else
            if [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]]; then
              sudo BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "" "${{ env.DEBIAN_VERSION }}"
            else
              sudo BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "" "${{ env.UBUNTU_VERSION }}"
            fi
          fi

      - name: 设置 artifact 名称
        id: set-artifact-name
        run: |
          ARTIFACT_NAME="${{ env.SYSTEM_TYPE }}-rootfs-${{ env.KERNEL_VERSION }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION }}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact 名称: $ARTIFACT_NAME"

      - name: 生成SHA256校验和
        run: |
          echo "生成校验和..."
          sha256sum rootfs.img xiaomi-k20pro-boot.img > sha256sums.txt
          cat sha256sums.txt

      - name: 压缩镜像
        run: |
          7z a rootfs.7z rootfs.img xiaomi-k20pro-boot.img

      - name: 上传镜像
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: |
            rootfs.7z
            sha256sums.txt
          retention-days: 30

      - name: 创建 Release
        if: github.event_name == 'workflow_dispatch'
        id: create-release
        run: |
          SHA256_ROOTFS=$(awk '{print $1}' sha256sums.txt | head -n1)
          SHA256_BOOT=$(awk '{print $1}' sha256sums.txt | tail -n1)

          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')

          if [[ "$SYSTEM_TYPE" == *"debian-"* ]]; then
            OS_NAME="Debian"
            OS_VERSION="$DEBIAN_VERSION"
          else
            OS_NAME="Ubuntu"
            OS_VERSION="$UBUNTU_VERSION"
          fi

          if [[ "$SYSTEM_TYPE" == *"server"* ]]; then
            SYSTEM_CATEGORY="Server"
          else
            SYSTEM_CATEGORY="Desktop"
          fi

          TAG="${SYSTEM_TYPE}-v${KERNEL_VERSION}-${OS_VERSION}"
          if [[ "$SYSTEM_TYPE" == *"phosh"* ]]; then
            TAG="${TAG}-${DESKTOP_ENV}"
          fi

          RELEASE_NAME="${OS_NAME} ${SYSTEM_CATEGORY} 镜像 v${KERNEL_VERSION} (${OS_VERSION})"
          if [[ "$SYSTEM_TYPE" == *"phosh"* ]]; then
            RELEASE_NAME="${RELEASE_NAME} - ${DESKTOP_ENV}"
          elif [[ "$SYSTEM_TYPE" == *"gnome"* ]]; then
            RELEASE_NAME="${RELEASE_NAME} - GNOME"
          fi

          cat > release_description.md << 'DESCRIPTION_EOF'
## 小米 Raphael (K20 Pro) Ubuntu Desktop 镜像

> 适用于小米 Raphael 设备的 Ubuntu Desktop 系统镜像

### 镜像信息

| 属性 | 值 |
|------|----|
| 系统版本 | Ubuntu 24.04 |
| 内核版本 | Linux 7.0 |
| 构建工具 | mmdebstrap |
| 构建时间 | TIMESTAMP_PLACEHOLDER |
| 构建 ID | BUILD_ID_PLACEHOLDER |

### SHA256 校验和

下载后请验证文件完整性：

- rootfs.img: SHA256_ROOTFS_PLACEHOLDER
- xiaomi-k20pro-boot.img: SHA256_BOOT_PLACEHOLDER

### 包含组件

- SSH 服务器（已启用密码登录）
- 中文语言支持
- NetworkManager 网络管理
- 设备专用驱动和固件
- USB NCM 网络共享（通过 USB 连接电脑上网）

### 默认用户

| 用户 | 密码 |
|------|------|
| user | 1234 |
| root | 1234 |

### USB NCM 网络共享

通过 USB 连接电脑后，设备会自动创建虚拟网络接口：

- 设备端 IP: 172.16.42.1
- 电脑端 IP: 172.16.42.2-254（DHCP 自动分配）
- SSH 连接: ssh user@172.16.42.1

### 注意事项

- 首次启动可能需要较长时间（约 1-2 分钟）
- 建议首次登录后修改默认密码
- 桌面版本首次启动可能需要配置显示

---

*使用 GitHub Actions 自动构建*
DESCRIPTION_EOF

          sed -i "s|TIMESTAMP_PLACEHOLDER|${TIMESTAMP}|g" release_description.md
          sed -i "s|BUILD_ID_PLACEHOLDER|${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}|g" release_description.md
          sed -i "s|SHA256_ROOTFS_PLACEHOLDER|${SHA256_ROOTFS}|g" release_description.md
          sed -i "s|SHA256_BOOT_PLACEHOLDER|${SHA256_BOOT}|g" release_description.md
          sed -i "s|Ubuntu 24.04|${OS_NAME} ${OS_VERSION}|g" release_description.md
          sed -i "s|Linux 7.0|Linux ${KERNEL_VERSION}|g" release_description.md
          sed -i "s|mmdebstrap|${BOOTSTRAP_TOOL}|g" release_description.md

          if [[ "$SYSTEM_TYPE" == *"phosh"* ]]; then
            sed -i 's|Ubuntu Desktop|'"${OS_NAME}"' Desktop|g' release_description.md
            sed -i 's|Desktop 镜像|'"${DESKTOP_ENV}"' 镜像|g' release_description.md
          elif [[ "$SYSTEM_TYPE" == *"gnome"* ]]; then
            sed -i 's|Ubuntu Desktop|'"${OS_NAME}"' Desktop - GNOME|g' release_description.md
          fi

          if [[ "$SYSTEM_TYPE" == *"server"* ]]; then
            sed -i 's|Ubuntu Desktop|Ubuntu Server|g' release_description.md
          fi

          DESCRIPTION_CONTENT=$(cat release_description.md)

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          rm -f release_description.md

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create-release.outputs.tag }}
          name: ${{ steps.create-release.outputs.name }}
          body: ${{ steps.create-release.outputs.description }}
          draft: false
          prerelease: false
          files: |
            rootfs.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理临时文件
        if: always()
        run: |
          sudo rm -f alsa-xiaomi-raphael.deb 2>/dev/null || true
          sudo rm -rf rootdir 2>/dev/null || true
          rm -rf xiaomi-raphael-debs_* 2>/dev/null || true
