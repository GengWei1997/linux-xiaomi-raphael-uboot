name: 构建系统镜像

on:
  workflow_dispatch:
    inputs:
      system_type:
        description: '系统类型'
        required: true
        type: choice
        options:
          - debian-server
          - debian-gnome
          - debian-phosh
          - ubuntu-server
          - ubuntu-gnome
          - ubuntu-phosh
      kernel_version:
        description: '内核版本号'
        required: true
        default: '6.18'
        type: string
      desktop_environment:
        description: '桌面环境 (仅适用于Phosh版本)'
        required: false
        default: 'phosh-full'
        type: choice
        options:
          - phosh-core
          - phosh-full
          - phosh-phone
      debian_version:
        description: 'Debian 版本 (仅适用于Debian类型)'
        required: false
        default: 'trixie'
        type: string
      ubuntu_version:
        description: 'Ubuntu 版本 (仅适用于Ubuntu类型)'
        required: false
        default: 'resolute'
        type: string
      use_docker:
        description: '使用 Docker 加速构建'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'

env:
  HOSTNAME: xiaomi-raphael
  BOOT_IMG: xiaomi-k20pro-boot.img
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPPRESS_DEPRECATION_WARNINGS: true

jobs:
  setup:
    name: 检查依赖
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 检查参数
        id: check-params
        run: |
          SYSTEM_TYPE="${{ github.event.inputs.system_type || 'ubuntu-server' }}"
          KERNEL_VERSION="${{ github.event.inputs.kernel_version || '6.18' }}"
          DESKTOP_ENV="${{ github.event.inputs.desktop_environment || 'phosh-full' }}"
          DEBIAN_VERSION="${{ github.event.inputs.debian_version || 'trixie' }}"
          UBUNTU_VERSION="${{ github.event.inputs.ubuntu_version || 'resolute' }}"
          USE_DOCKER="${{ github.event.inputs.use_docker || 'false' }}"

          echo "system_type=$SYSTEM_TYPE" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "desktop_environment=$DESKTOP_ENV" >> $GITHUB_OUTPUT
          echo "debian_version=$DEBIAN_VERSION" >> $GITHUB_OUTPUT
          echo "ubuntu_version=$UBUNTU_VERSION" >> $GITHUB_OUTPUT
          echo "use_docker=$USE_DOCKER" >> $GITHUB_OUTPUT

    outputs:
      system_type: ${{ steps.check-params.outputs.system_type }}
      kernel_version: ${{ steps.check-params.outputs.kernel_version }}
      desktop_environment: ${{ steps.check-params.outputs.desktop_environment }}
      debian_version: ${{ steps.check-params.outputs.debian_version }}
      ubuntu_version: ${{ steps.check-params.outputs.ubuntu_version }}
      use_docker: ${{ steps.check-params.outputs.use_docker }}

  build:
    name: 构建镜像
    needs: setup
    runs-on: ubuntu-24.04-arm
    env:
      SYSTEM_TYPE: ${{ needs.setup.outputs.system_type }}
      KERNEL_VERSION: ${{ needs.setup.outputs.kernel_version }}
      DESKTOP_ENV: ${{ needs.setup.outputs.desktop_environment }}
      DEBIAN_VERSION: ${{ needs.setup.outputs.debian_version }}
      UBUNTU_VERSION: ${{ needs.setup.outputs.ubuntu_version }}
      USE_DOCKER: ${{ needs.setup.outputs.use_docker }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 debootstrap
        if: ${{ needs.setup.outputs.use_docker != 'true' }}
        run: |
          if ! command -v debootstrap &> /dev/null; then
            echo "安装 debootstrap..."
            sudo apt update
            sudo apt install -y debootstrap
          else
            echo "debootstrap 已安装，跳过"
          fi

      - name: 下载内核包
        run: |
          mkdir -p xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}

          echo "正在下载内核包 (版本: ${{ env.KERNEL_VERSION }})..."

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb \
            "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb"

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb \
            "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb"

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb \
            "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb"

          # 桌面版本需要额外的alsa包
          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* || "${{ env.SYSTEM_TYPE }}" == *"gnome"* ]]; then
            curl -sL -o alsa-xiaomi-raphael.deb \
              "https://github.com/${{ github.repository }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/alsa-xiaomi-raphael.deb"
          fi

      - name: 下载 boot.img
        run: |
          curl -sL -o xiaomi-k20pro-boot.img \
            "https://github.com/GengWei1997/kernel-deb/releases/download/v1.0.0/xiaomi-k20pro-boot.img"

      - name: 检查必要文件
        run: |
          echo "检查构建所需文件..."

          if [ ! -f "xiaomi-k20pro-boot.img" ]; then
            echo "错误: xiaomi-k20pro-boot.img 不存在"
            exit 1
          fi

          if [ ! -f "xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" ]; then
            echo "错误: linux-image-xiaomi-raphael.deb 不存在"
            exit 1
          fi

          echo "所有必要文件存在"

      - name: 执行构建
        run: |
          set -e

          chmod +x build.sh

          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]]; then
            if [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]]; then
              sudo DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" USE_DOCKER="${{ env.USE_DOCKER }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "${{ env.DESKTOP_ENV }}" "${{ env.DEBIAN_VERSION }}" "${{ env.USE_DOCKER }}"
            else
              sudo UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" USE_DOCKER="${{ env.USE_DOCKER }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "${{ env.DESKTOP_ENV }}" "${{ env.UBUNTU_VERSION }}" "${{ env.USE_DOCKER }}"
            fi
          else
            if [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]]; then
              sudo DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" USE_DOCKER="${{ env.USE_DOCKER }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "" "${{ env.DEBIAN_VERSION }}" "${{ env.USE_DOCKER }}"
            else
              sudo UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" USE_DOCKER="${{ env.USE_DOCKER }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "" "${{ env.UBUNTU_VERSION }}" "${{ env.USE_DOCKER }}"
            fi
          fi

      - name: 生成 SHA256 校验和
        run: |
          echo "生成校验和..."
          if [ -f "sha256sums.txt" ]; then
            cat sha256sums.txt
          else
            sha256sum rootfs.img rootfs.7z > sha256sums.txt
            cat sha256sums.txt
          fi

      - name: 设置 artifact 名称
        id: set-artifact-name
        run: |
          ARTIFACT_NAME="${{ needs.setup.outputs.system_type }}-rootfs-${{ env.KERNEL_VERSION }}-${{ needs.setup.outputs.debian_version || needs.setup.outputs.ubuntu_version }}"
          if [ "${{ needs.setup.outputs.use_docker }}" == "true" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}-docker"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact 名称: $ARTIFACT_NAME"

      - name: 压缩镜像
        run: |
          7z a rootfs.7z rootfs.img xiaomi-k20pro-boot.img

      - name: 上传镜像
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: |
            rootfs.7z
          retention-days: 30

      - name: 清理临时文件
        if: always()
        run: |
          sudo rm -f alsa-xiaomi-raphael.deb 2>/dev/null || true
          sudo rm -rf rootdir 2>/dev/null || true
          rm -rf xiaomi-raphael-debs_* 2>/dev/null || true
          rm -f sha256sums.txt 2>/dev/null || true

  release:
    name: 发布 Release
    needs: [build, setup]
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: 设置 artifact 名称
        id: set-artifact-name
        run: |
          ARTIFACT_NAME="${{ needs.setup.outputs.system_type }}-rootfs-${{ needs.setup.outputs.kernel_version }}-${{ needs.setup.outputs.debian_version || needs.setup.outputs.ubuntu_version }}"
          if [ "${{ needs.setup.outputs.use_docker }}" == "true" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}-docker"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact 名称: $ARTIFACT_NAME"

      - name: 下载镜像
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: .

      - name: 生成SHA256校验和
        id: sha256
        run: |
          SHA256_ROOTFS=$(sha256sum rootfs.img | awk '{print $1}')
          SHA256_BOOT=$(sha256sum xiaomi-k20pro-boot.img | awk '{print $1}')
          echo "sha256_rootfs=$SHA256_ROOTFS" >> $GITHUB_OUTPUT
          echo "sha256_boot=$SHA256_BOOT" >> $GITHUB_OUTPUT
          echo "SHA256 校验和:"
          echo "rootfs.img: $SHA256_ROOTFS"
          echo "xiaomi-k20pro-boot.img: $SHA256_BOOT"

      - name: 获取构建信息
        id: build-info
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          if [[ "${{ needs.setup.outputs.system_type }}" == *"debian-"* ]]; then
            OS_NAME="Debian"
            OS_VERSION="${{ needs.setup.outputs.debian_version }}"
          elif [[ "${{ needs.setup.outputs.system_type }}" == *"ubuntu-"* ]]; then
            OS_NAME="Ubuntu"
            OS_VERSION="${{ needs.setup.outputs.ubuntu_version }}"
          else
            OS_NAME="Unknown"
            OS_VERSION="unknown"
          fi
          echo "os_name=$OS_NAME" >> $GITHUB_OUTPUT
          echo "os_version=$OS_VERSION" >> $GITHUB_OUTPUT

          if [[ "${{ needs.setup.outputs.system_type }}" == *"server"* ]]; then
            SYSTEM_CATEGORY="Server"
          else
            SYSTEM_CATEGORY="Desktop"
          fi
          echo "system_category=$SYSTEM_CATEGORY" >> $GITHUB_OUTPUT

      - name: 生成Release信息
        id: release-info
        run: |
          TAG="${{ needs.setup.outputs.system_type }}-v${{ needs.setup.outputs.kernel_version }}-${{ needs.setup.outputs.debian_version || needs.setup.outputs.ubuntu_version }}"
          if [[ "${{ needs.setup.outputs.system_type }}" == *"phosh"* ]]; then
            TAG="${TAG}-${{ needs.setup.outputs.desktop_environment }}"
          fi
          if [[ "${{ needs.setup.outputs.use_docker }}" == "true" ]]; then
            TAG="${TAG}-docker"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

          RELEASE_NAME="${{ steps.build-info.outputs.os_name }} ${{ steps.build-info.outputs.system_category }} 镜像 v${{ needs.setup.outputs.kernel_version }} (${{ steps.build-info.outputs.os_version }})"
          if [[ "${{ needs.setup.outputs.system_type }}" == *"phosh"* ]]; then
            RELEASE_NAME="${RELEASE_NAME} - ${{ needs.setup.outputs.desktop_environment }}"
          elif [[ "${{ needs.setup.outputs.system_type }}" == *"gnome"* ]]; then
            RELEASE_NAME="${RELEASE_NAME} - GNOME"
          fi
          if [[ "${{ needs.setup.outputs.use_docker }}" == "true" ]]; then
            RELEASE_NAME="${RELEASE_NAME} [Docker 加速]"
          fi
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: 生成Release描述
        id: release-desc
        run: |
          DESCRIPTION="小米 Raphael 设备 ${{ steps.build-info.outputs.os_name }} ${{ steps.build-info.outputs.system_category }} 镜像\n"
          DESCRIPTION="${DESCRIPTION}- 系统版本: ${{ steps.build-info.outputs.os_name }} ${{ steps.build-info.outputs.os_version }}\n"
          DESCRIPTION="${DESCRIPTION}- 内核版本: ${{ needs.setup.outputs.kernel_version }}\n"

          if [[ "${{ needs.setup.outputs.system_type }}" == *"phosh"* ]]; then
            DESCRIPTION="${DESCRIPTION}- 桌面环境: ${{ needs.setup.outputs.desktop_environment }}\n"
          elif [[ "${{ needs.setup.outputs.system_type }}" == *"gnome"* ]]; then
            DESCRIPTION="${DESCRIPTION}- 桌面环境: GNOME\n"
          fi

          if [[ "${{ needs.setup.outputs.use_docker }}" == "true" ]]; then
            DESCRIPTION="${DESCRIPTION}- 构建模式: Docker 加速模式 ⚡\n"
          else
            DESCRIPTION="${DESCRIPTION}- 构建模式: 标准模式 (debootstrap) 🛠️\n"
          fi

          DESCRIPTION="${DESCRIPTION}- 构建时间: ${{ steps.build-info.outputs.timestamp }}\n"
          DESCRIPTION="${DESCRIPTION}- 构建 ID: ${{ github.run_id }}-${{ github.run_number }}\n\n"

          DESCRIPTION="${DESCRIPTION}SHA256 校验和：\n"
          DESCRIPTION="${DESCRIPTION}\`\`\`\n"
          DESCRIPTION="${DESCRIPTION}rootfs.img: ${{ steps.sha256.outputs.sha256_rootfs }}\n"
          DESCRIPTION="${DESCRIPTION}xiaomi-k20pro-boot.img: ${{ steps.sha256.outputs.sha256_boot }}\n"
          DESCRIPTION="${DESCRIPTION}\`\`\`\n\n"

          if [[ "${{ needs.setup.outputs.system_type }}" == *"server"* ]]; then
            DESCRIPTION="${DESCRIPTION}说明：\n"
            DESCRIPTION="${DESCRIPTION}- 这是一个无图形界面的服务器版本\n"
            DESCRIPTION="${DESCRIPTION}- 包含基础网络管理工具\n"
            DESCRIPTION="${DESCRIPTION}- 已安装 SSH 服务器\n"
            DESCRIPTION="${DESCRIPTION}- 已安装中文语言支持\n"
            DESCRIPTION="${DESCRIPTION}- 包含必要的设备驱动和固件\n"
          else
            DESCRIPTION="${DESCRIPTION}说明：\n"
            DESCRIPTION="${DESCRIPTION}- 这是一个带有图形界面的桌面版本\n"
            if [[ "${{ needs.setup.outputs.system_type }}" == *"phosh"* ]]; then
              DESCRIPTION="${DESCRIPTION}- 包含 ${{ needs.setup.outputs.desktop_environment }} 桌面环境\n"
            else
              DESCRIPTION="${DESCRIPTION}- 包含 GNOME 桌面环境\n"
            fi
            DESCRIPTION="${DESCRIPTION}- 已安装 SSH 服务器\n"
            DESCRIPTION="${DESCRIPTION}- 已安装中文语言支持\n"
            DESCRIPTION="${DESCRIPTION}- 包含必要的设备驱动和固件\n"
          fi

          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag_name }}
          name: ${{ steps.release-info.outputs.release_name }}
          body: ${{ steps.release-desc.outputs.description }}
          draft: false
          prerelease: false
          files: |
            rootfs.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}