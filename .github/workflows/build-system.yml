name: 构建系统镜像

on:
  workflow_dispatch:
    inputs:
      enable_parallel:
        description: '启用并行构建 (矩阵模式)'
        required: false
        default: true
        type: boolean
      system_type:
        description: '系统类型 (单构建模式时使用)'
        required: false
        type: choice
        options:
          - debian-server
          - debian-gnome
          - debian-phosh
          - ubuntu-server
          - ubuntu-gnome
          - ubuntu-phosh
        default: 'ubuntu-server'
      kernel_version:
        description: '内核版本号'
        required: true
        type: choice
        options:
          - '6.18'
          - '7.0'
        default: '7.0'
      bootstrap_tool:
        description: '构建工具 (mmdebstrap更快，推荐使用)'
        required: true
        type: choice
        options:
          - mmdebstrap
          - debootstrap
        default: 'mmdebstrap'
      desktop_environment:
        description: '桌面环境 (仅适用于Phosh版本)'
        required: false
        default: 'phosh-full'
        type: choice
        options:
          - phosh-core
          - phosh-full
          - phosh-phone
      debian_version:
        description: 'Debian 版本 (仅适用于Debian类型)'
        required: false
        type: choice
        options:
          - trixie
          - bookworm
        default: 'trixie'
      ubuntu_version:
        description: 'Ubuntu 版本 (仅适用于Ubuntu类型)'
        required: false
        type: choice
        options:
          - noble
          - resolute
        default: 'resolute'
      kernel_repository:
        description: '内核包仓库 (默认: GengWei1997/linux-xiaomi-raphael-uboot)'
        required: false
        default: 'GengWei1997/linux-xiaomi-raphael-uboot'
        type: string
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'build.sh'
      - '*.sh'

env:
  HOSTNAME: xiaomi-raphael
  BOOT_IMG: xiaomi-k20pro-boot.img
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPPRESS_DEPRECATION_WARNINGS: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ github.event.inputs.enable_parallel == 'true' && format('构建 {0} 镜像', matrix.system_type) || '构建单镜像' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include: ${{ github.event.inputs.enable_parallel == 'true' && fromJSON('[{"system_type":"debian-server","kernel_version":"6.18","bootstrap_tool":"mmdebstrap","debian_version":"trixie","ubuntu_version":"","desktop_env":""},{"system_type":"debian-server","kernel_version":"7.0","bootstrap_tool":"mmdebstrap","debian_version":"trixie","ubuntu_version":"","desktop_env":""},{"system_type":"debian-gnome","kernel_version":"6.18","bootstrap_tool":"mmdebstrap","debian_version":"trixie","ubuntu_version":"","desktop_env":""},{"system_type":"debian-gnome","kernel_version":"7.0","bootstrap_tool":"mmdebstrap","debian_version":"trixie","ubuntu_version":"","desktop_env":""},{"system_type":"debian-phosh","kernel_version":"6.18","bootstrap_tool":"mmdebstrap","debian_version":"trixie","ubuntu_version":"","desktop_env":"phosh-full"},{"system_type":"debian-phosh","kernel_version":"7.0","bootstrap_tool":"mmdebstrap","debian_version":"trixie","ubuntu_version":"","desktop_env":"phosh-full"},{"system_type":"ubuntu-server","kernel_version":"6.18","bootstrap_tool":"mmdebstrap","debian_version":"","ubuntu_version":"resolute","desktop_env":""},{"system_type":"ubuntu-server","kernel_version":"7.0","bootstrap_tool":"mmdebstrap","debian_version":"","ubuntu_version":"resolute","desktop_env":""},{"system_type":"ubuntu-gnome","kernel_version":"6.18","bootstrap_tool":"mmdebstrap","debian_version":"","ubuntu_version":"resolute","desktop_env":""},{"system_type":"ubuntu-gnome","kernel_version":"7.0","bootstrap_tool":"mmdebstrap","debian_version":"","ubuntu_version":"resolute","desktop_env":""},{"system_type":"ubuntu-phosh","kernel_version":"6.18","bootstrap_tool":"mmdebstrap","debian_version":"","ubuntu_version":"resolute","desktop_env":"phosh-full"},{"system_type":"ubuntu-phosh","kernel_version":"7.0","bootstrap_tool":"mmdebstrap","debian_version":"","ubuntu_version":"resolute","desktop_env":"phosh-full"}]') || fromJSON(format('[{{"system_type":"{0}","kernel_version":"{1}","bootstrap_tool":"{2}","debian_version":"{3}","ubuntu_version":"{4}","desktop_env":"{5}"}}]', github.event.inputs.system_type, github.event.inputs.kernel_version, github.event.inputs.bootstrap_tool, github.event.inputs.debian_version, github.event.inputs.ubuntu_version, github.event.inputs.desktop_environment)) }}
    env:
      SYSTEM_TYPE: ${{ matrix.system_type || github.event.inputs.system_type }}
      KERNEL_VERSION: ${{ matrix.kernel_version || github.event.inputs.kernel_version }}
      BOOTSTRAP_TOOL: ${{ matrix.bootstrap_tool || github.event.inputs.bootstrap_tool }}
      DESKTOP_ENV: ${{ matrix.desktop_env || github.event.inputs.desktop_environment }}
      DEBIAN_VERSION: ${{ matrix.debian_version || github.event.inputs.debian_version }}
      UBUNTU_VERSION: ${{ matrix.ubuntu_version || github.event.inputs.ubuntu_version }}
      KERNEL_REPO: ${{ github.event.inputs.kernel_repository || 'GengWei1997/linux-xiaomi-raphael-uboot' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装构建工具
        run: |
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 检查并安装构建工具: ${{ env.BOOTSTRAP_TOOL }}"
          
          if [ "${{ env.BOOTSTRAP_TOOL }}" = "mmdebstrap" ]; then
            if ! command -v mmdebstrap &> /dev/null; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   安装 mmdebstrap 和依赖..."
              sudo apt-get update
              sudo apt-get install -y mmdebstrap debian-archive-keyring
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   mmdebstrap 安装完成"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   mmdebstrap 已安装，跳过"
            fi
          else
            if ! command -v debootstrap &> /dev/null; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   安装 debootstrap..."
              sudo apt-get update
              sudo apt-get install -y debootstrap
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   debootstrap 安装完成"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')]   debootstrap 已安装，跳过"
            fi
          fi

      - name: 下载内核包和boot.img (并行)
        run: |
          mkdir -p xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}

          echo "正在下载内核包和boot.img (版本: ${{ env.KERNEL_VERSION }})..."

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" &
          PID1=$!

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/linux-headers-xiaomi-raphael.deb" &
          PID2=$!

          curl -sL -o xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb \
            "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/firmware-xiaomi-raphael.deb" &
          PID3=$!

          curl -sL -o xiaomi-k20pro-boot.img \
            "https://github.com/GengWei1997/kernel-deb/releases/download/v1.0.0/xiaomi-k20pro-boot.img" &
          PID4=$!

          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* || "${{ env.SYSTEM_TYPE }}" == *"gnome"* ]]; then
            curl -sL -o alsa-xiaomi-raphael.deb \
              "https://github.com/${{ env.KERNEL_REPO }}/releases/download/kernel-v${{ env.KERNEL_VERSION }}/alsa-xiaomi-raphael.deb" &
            PID5=$!
          fi

          wait $PID1 $PID2 $PID3 $PID4
          [ -n "$PID5" ] && wait $PID5 || true

          echo "所有文件下载完成"

      - name: 检查必要文件
        run: |
          echo "检查构建所需文件..."

          if [ ! -f "xiaomi-k20pro-boot.img" ]; then
            echo "错误: xiaomi-k20pro-boot.img 不存在"
            exit 1
          fi

          if [ ! -f "xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}/linux-image-xiaomi-raphael.deb" ]; then
            echo "错误: linux-image-xiaomi-raphael.deb 不存在"
            exit 1
          fi

          echo "所有必要文件存在"

      - name: 执行构建
        run: |
          set -e

          chmod +x build.sh

          sudo BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" ./build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}" "${{ env.DESKTOP_ENV }}" "${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION }}"

      - name: 生成SHA256校验和
        run: |
          SUFFIX="${{ matrix.system_type }}-${{ matrix.kernel_version }}-${{ matrix.debian_version || matrix.ubuntu_version }}"
          echo "生成校验和... ($SUFFIX)"
          sha256sum rootfs.img xiaomi-k20pro-boot.img > sha256sums-${SUFFIX}.txt
          cat sha256sums-${SUFFIX}.txt

      - name: 压缩镜像
        run: |
          7z a rootfs.7z rootfs.img xiaomi-k20pro-boot.img

      - name: 准备 Release 变量
        if: github.event_name == 'workflow_dispatch'
        id: create-release
        run: |
          # 1. 提取校验和
          SHA256_ROOTFS=$(awk 'NR==1 {print $1}' sha256sums.txt)
          SHA256_BOOT=$(awk 'NR==2 {print $1}' sha256sums.txt)
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')

          # 2. 确定系统元数据
          [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]] && OS_NAME="Debian" || OS_NAME="Ubuntu"
          [[ "${{ env.SYSTEM_TYPE }}" == *"server"* ]] && CATEGORY="Server" || CATEGORY="Desktop"
          [[ "${{ env.SYSTEM_TYPE }}" == *"debian-"* ]] && OS_VERSION="${{ env.DEBIAN_VERSION }}" || OS_VERSION="${{ env.UBUNTU_VERSION }}"
          
          # 3. 构造 Release 标题和标签
          # 标签: 系统类型-内核-系统版本[-桌面环境]
          TAG="${{ env.SYSTEM_TYPE }}-v${{ env.KERNEL_VERSION }}-${OS_VERSION}"
          [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]] && TAG="${TAG}-${{ env.DESKTOP_ENV }}"
          
          # 标题: 更加直观的展示
          RELEASE_TITLE="${OS_NAME} ${CATEGORY} 镜像 v${{ env.KERNEL_VERSION }} (${OS_VERSION})"
          if [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]]; then
            RELEASE_TITLE="${RELEASE_TITLE} - ${{ env.DESKTOP_ENV }}"
          elif [[ "${{ env.SYSTEM_TYPE }}" == *"gnome"* ]]; then
            RELEASE_TITLE="${RELEASE_TITLE} - GNOME"
          fi

          # 4. 直接利用 Heredoc 生成描述内容 (无需 sed)
          {
            echo "description<<EOF"
            echo "## 小米 Raphael (K20 Pro) ${OS_NAME} 镜像"
            echo ""
            echo "> 适用于小米 Raphael (K20 Pro/Mi 9T Pro) 的 ${OS_NAME} ${CATEGORY} 自动构建版本"
            echo ""
            echo "### 📊 镜像信息"
            echo "| 属性 | 值 |"
            echo "|------|----|"
            echo "| 系统版本 | ${OS_NAME} ${OS_VERSION} |"
            echo "| 内核版本 | Linux ${{ env.KERNEL_VERSION }} |"
            echo "| 构建工具 | ${{ env.BOOTSTRAP_TOOL }} |"
            echo "| 构建时间 | ${TIMESTAMP} |"
            echo "| 构建 ID | ${GITHUB_RUN_ID} |"
            echo ""
            echo "### 🔒 SHA256 校验"
            echo "\`\`\`"
            echo "rootfs.img: ${SHA256_ROOTFS}"
            echo "boot.img:   ${SHA256_BOOT}"
            echo "\`\`\`"
            echo ""
            echo "### 🔑 默认凭据"
            echo "- **用户**: \`user\` / **密码**: \`1234\`"
            echo "- **用户**: \`root\` / **密码**: \`1234\`"
            echo ""
            echo "### 🌐 网络连接 (USB NCM)"
            echo "- 设备 IP: \`172.16.42.1\`"
            echo "- SSH 命令: \`ssh user@172.16.42.1\`"
            echo ""
            echo "---"
            echo "*Built with ❤️ by GitHub Actions*"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create-release.outputs.tag }}
          name: ${{ steps.create-release.outputs.name }}
          body: ${{ steps.create-release.outputs.description }}
          draft: false
          prerelease: false
          files: |
            rootfs.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理临时文件
        if: always()
        run: |
          SUFFIX="${{ matrix.system_type }}-${{ matrix.kernel_version }}-${{ matrix.debian_version || matrix.ubuntu_version }}"
          sudo rm -f alsa-xiaomi-raphael.deb 2>/dev/null || true
          sudo rm -rf rootdir 2>/dev/null || true
          rm -rf xiaomi-raphael-debs_* 2>/dev/null || true
          rm -f sha256sums-${SUFFIX}.txt 2>/dev/null || true
